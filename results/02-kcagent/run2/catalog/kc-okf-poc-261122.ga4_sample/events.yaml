  dataplex-types.global.overview:
    content: >
      The `kc-okf-poc-261122.ga4_sample/events` asset contains a Google
      Analytics 4 (GA4) event-level sample dataset. Sourced from the real-world
      Google Merchandise Store—an active online retailer selling Google-branded
      products—it captures standard user interaction data and custom e-commerce
      tracking logs. To safeguard business performance metrics and protect user
      privacy, the data has been obfuscated with placeholder values like
      `<Other>`, `NULL`, and empty strings.


      This sample covers a three-month duration from November 1, 2020, to
      January 31, 2021. Because GA4 data utilizes a highly nested and repeated
      schema (containing structures for event parameters, user properties, and
      transaction items), this dataset is highly valuable for data analysts,
      engineers, and developers. It serves as an ideal training ground to master
      nested SQL operations using functions like `UNNEST()`, construct
      behavioral funnels, and prototype business intelligence reports in
      platforms like Looker Studio and Tableau.


      ## Data Details


      * **Origin and Subject:** Google Merchandise Store web traffic, capturing
      standard web analytics, enhanced measurements, and e-commerce
      transactions.

      * **Temporal Scope:** Covers events logged between November 1, 2020, and
      January 31, 2021.

      * **Obfuscation Placeholders:** Contains values such as `<Other>`, `NULL`,
      and empty strings to protect proprietary business metrics, meaning totals
      will not precisely match live reporting.

      * **Schema Nesting:** Features nested `RECORD` fields to group related
      context:
        * `event_params` (repeated): Pairs parameters using custom keys and multi-type values (string, integer, float, or double).
        * `user_properties` (repeated): Captures custom, visitor-level dimensions and attributes.
        * `items` (repeated): Captures multi-item order lists containing detailed product data (name, brand, category, price, and quantity).
      * **Performance Optimizations:** Includes the `event_date_dt` field (type
      `DATE`) in addition to the standard string-based `event_date` to
      facilitate efficient partitioning and querying.


      ## Usage Details


      * **Restricting Scanned Data:** To control query costs and increase
      efficiency in BigQuery, always include date filters on the `event_date_dt`
      column.

      * **Handling Nested Arrays:** Accessing values stored in fields like
      `event_params` and `items` requires the use of the `UNNEST()` function to
      flatten the rows.

      * **Analyzing Sessions:** Sessions are not recorded as a pre-joined flat
      dimension. Users must either query the `'session_start'` event or flatten
      `event_params` to locate the `'ga_session_id'` key.


      ### SQL Query Examples


      **1. High-Level Volume Analysis**

      Understand the overall scale of the data by counting total event rows,
      distinct visitors (via device cookies), and distinct dates:

      ```sql

      SELECT 
        COUNT(*) AS total_events, 
        COUNT(DISTINCT user_pseudo_id) AS total_unique_users, 
        COUNT(DISTINCT event_date) AS total_days
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`
      ```


      **2. Active User Count by Date Range**

      Filter on the optimized `event_date_dt` column to query daily unique
      active users:

      ```sql

      SELECT 
        event_date, 
        COUNT(DISTINCT user_pseudo_id) as active_users 
      FROM 
        `kc-okf-poc-261122.ga4_sample.events` 
      WHERE 
        event_date_dt BETWEEN PARSE_DATE('%Y%m%d', '20201201') AND PARSE_DATE('%Y%m%d', '20201231') 
      GROUP BY 
        event_date 
      ORDER BY 
        event_date ASC
      ```


      **3. Session Analysis (Unnesting Parameters)**

      Calculate the count of unique sessions by filtering for the
      `'session_start'` event and unnesting its parameters:

      ```sql

      SELECT 
        COUNT(DISTINCT value.int_value) AS total_sessions
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`, 
        UNNEST(event_params) 
      WHERE 
        event_name = 'session_start' 
        AND key = 'ga_session_id'
      ```


      **4. E-Commerce Product Interest (Unnesting Items)**

      Locate top items that are added to carts by flattening the `items` array
      and filtering on the `'add_to_cart'` event:

      ```sql

      SELECT 
        items.item_name, 
        COUNT(*) AS added_to_cart_count 
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`, 
        UNNEST(items) AS items
      WHERE 
        event_name = 'add_to_cart' 
      GROUP BY 
        items.item_name 
      ORDER BY 
        added_to_cart_count DESC 
      LIMIT 10

      ```


