  dataplex-types.global.overview:
    content: >
      The `kc-okf-poc-261122.ga4_sample/events` asset contains raw, event-level
      data exported from a Google Analytics 4 (GA4) implementation. This data
      originates from the Google Merchandise Store, a real e-commerce platform
      that sells Google-branded apparel and accessories. The dataset provides
      standard web e-commerce measurement events along with enhanced tracking
      features, making it a powerful resource for analytics, query prototyping,
      and data science modeling.


      This dataset spans a three-month period from November 1, 2020, to January
      31, 2021. To protect user privacy and sensitive business operations, the
      underlying metrics and details are obfuscated with placeholder values like
      `<Other>`, `NULL`, and empty strings. While structurally rich, this data
      does not support direct benchmarking against the live Google Merchandise
      Store, though it preserves realistic schemas and relationships for
      development.


      The schema is highly nested, employing repeated record fields to
      encapsulate attributes such as event parameters, user properties, and
      product lists. Analysts can leverage this asset to practice complex
      querying patterns, SQL operations like `UNNEST()`, sessionization
      techniques, and visual dashboard prototyping in platforms like Looker
      Studio or Tableau.


      ## Data Details


      * **Origin and Activity Source**: Real web tracking data from the Google
      Merchandise Store, implementing GA4 enhanced measurement and standard
      e-commerce setups.

      * **Temporal Horizon**: Covers user events logged between November 1,
      2020, and January 31, 2021.

      * **Privacy Controls**: Features deliberate obfuscation of sensitive
      values to protect business operations and user identity, which means
      metrics do not align with live store benchmarks.

      * **Highly Nested Schema**:
        * `event_params`: Key-value pairs capturing event-specific properties (e.g., session identifiers, page URLs).
        * `user_properties`: Captures persistent user-level attributes.
        * `items`: Lists e-commerce products involved in an event, detailing names, categories, and transaction quantities.
      * **Key Event Columns**:
        * `event_name`: Categorizes actions (e.g., `page_view`, `session_start`, `add_to_cart`, `purchase`).
        * `event_date` & `event_date_dt`: Date fields representing when the event occurred, enabling date-partitioned analysis.
        * `user_pseudo_id`: Persistent anonymous device identifiers.
        * `device`, `geo`, & `traffic_source`: Provide granular dimensions detailing technology, location (city, country), and acquisition channel.
        * `ecommerce` & `user_ltv`: Store transactional details like total revenue, tax, and customer lifetime value in USD.

      ## Usage Details


      * **Cost Optimization & Performance**: Because GA4 datasets are highly
      voluminous, queries should always use a filter on the partition column
      (`event_date_dt`) within the `WHERE` clause. This limits the data scanned
      and dramatically minimizes query execution costs.

      * **Flattening Nested Records**: Since fields like `event_params` and
      `items` are arrays of structs, use the SQL `UNNEST()` function to flatten
      these columns and make individual elements queryable.

      * **Session Analysis**: Because GA4 does not store sessions as unique
      records, individual sessions must be calculated by targeting the
      `session_start` event and unnesting the `ga_session_id` parameter from the
      `event_params` array.

      * **E-Commerce Funnel Tracking**: Top items and user conversion paths can
      be tracked by matching actions like `add_to_cart` and unnesting the
      corresponding `items` array.


      ### Query Examples


      #### 1. High-Level Event and User Scale

      To understand the scale of the dataset, count the total events, unique
      users, and total tracked days:

      ```sql

      SELECT 
        COUNT(*) AS total_events, 
        COUNT(DISTINCT user_pseudo_id) AS total_unique_users, 
        COUNT(DISTINCT event_date) AS total_days
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`
      ```


      #### 2. Querying within a Specific Date Range

      Filter queries on `event_date_dt` to restrict query scan size and enhance
      performance:

      ```sql

      SELECT 
        event_date, 
        COUNT(DISTINCT user_pseudo_id) as active_users 
      FROM 
        `kc-okf-poc-261122.ga4_sample.events` 
      WHERE 
        event_date_dt BETWEEN PARSE_DATE('%Y%m%d', '20201201') AND PARSE_DATE('%Y%m%d', '20201231') 
      GROUP BY 
        event_date 
      ORDER BY 
        event_date ASC
      ```


      #### 3. Analyzing Sessions (Unnesting Parameters)

      Extract the unique session count by filtering for the `session_start`
      event and unnesting its parameters:

      ```sql

      SELECT 
        COUNT(DISTINCT value.int_value) AS total_sessions
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`, 
        UNNEST(event_params) 
      WHERE 
        event_name = 'session_start' 
        AND key = 'ga_session_id'
      ```


      #### 4. Top E-Commerce Products (Added to Cart)

      Identify the top 10 most popular products added to the shopping cart:

      ```sql

      SELECT 
        items.item_name, 
        COUNT(*) AS added_to_cart_count 
      FROM 
        `kc-okf-poc-261122.ga4_sample.events`, 
        UNNEST(items) AS items
      WHERE 
        event_name = 'add_to_cart' 
      GROUP BY 
        items.item_name 
      ORDER BY 
        added_to_cart_count DESC 
      LIMIT 10

      ```


