<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#202124">Step 5: same agent, same 15 questions, three ways to get context</text>
  <text x="20" y="52" fill="#5f6368">Questions answered correctly (out of 15), checked by running the agent's final SQL against golden SQL in BigQuery</text>

  <!-- axis -->
  <line x1="250" y1="70" x2="250" y2="300" stroke="#9aa0a6"/>
  <g fill="#5f6368" font-size="11">
    <text x="246" y="318">0</text><text x="400" y="318">5</text><text x="550" y="318">10</text><text x="697" y="318">15</text>
  </g>
  <g stroke="#e8eaed"><line x1="400" y1="70" x2="400" y2="300"/><line x1="550" y1="70" x2="550" y2="300"/><line x1="700" y1="70" x2="700" y2="300"/></g>

  <!-- A -->
  <text x="20" y="100" font-weight="600" fill="#202124">A: no context</text>
  <text x="20" y="118" fill="#5f6368">schema + SQL tools only</text>
  <rect x="250" y="86" width="180" height="18" fill="#9aa0a6"/><text x="436" y="100" fill="#202124">6 strict</text>
  <rect x="250" y="106" width="180" height="12" fill="#dadce0"/><text x="436" y="117" fill="#5f6368">6 reviewed</text>

  <!-- B -->
  <text x="20" y="170" font-weight="600" fill="#202124">B: KC context as OKF files</text>
  <text x="20" y="188" fill="#5f6368">kcmd pull --format okf, read_file</text>
  <rect x="250" y="156" width="300" height="18" fill="#1a73e8"/><text x="556" y="170" fill="#202124">10 strict</text>
  <rect x="250" y="176" width="390" height="12" fill="#aecbfa"/><text x="646" y="187" fill="#5f6368">13 reviewed</text>

  <!-- C -->
  <text x="20" y="240" font-weight="600" fill="#202124">C: KC context via kcmd MCP</text>
  <text x="20" y="258" fill="#5f6368">list-entries / lookup-entry</text>
  <rect x="250" y="226" width="360" height="18" fill="#188038"/><text x="616" y="240" fill="#202124">12 strict</text>
  <rect x="250" y="246" width="420" height="12" fill="#a8dab5"/><text x="676" y="257" fill="#5f6368">14 reviewed</text>

  <text x="20" y="345" fill="#3c4043">Held-out questions 13–15 (Studio never saw them): A 0/3, B 3/3, C 3/3.  Policy breaks (geo.city used): A 2, B 0, C 0.</text>
  <text x="20" y="365" fill="#3c4043">"Reviewed" counts answers that differ from the golden SQL only by a defensible reading (see the per-question table). One run per question.</text>
</svg>
