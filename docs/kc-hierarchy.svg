<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#202124">Knowledge Catalog: how the pieces nest (our POC)</text>

  <!-- Project -->
  <rect x="20" y="50" width="820" height="490" rx="10" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="36" y="74" font-weight="600" fill="#202124">Project  kc-okf-poc-261122</text>

  <!-- Location -->
  <rect x="40" y="88" width="780" height="438" rx="10" fill="#e8f0fe" stroke="#8ab4f8"/>
  <text x="56" y="112" font-weight="600" fill="#174ea6">Location  us</text>

  <!-- Entry group -->
  <rect x="60" y="126" width="740" height="386" rx="10" fill="#e6f4ea" stroke="#81c995"/>
  <text x="76" y="150" font-weight="600" fill="#0d652d">Entry group  @bigquery</text>
  <text x="290" y="150" fill="#3c4043">(system group: Google fills it with one entry per BigQuery object)</text>

  <!-- Dataset entry -->
  <rect x="80" y="166" width="330" height="330" rx="8" fill="#ffffff" stroke="#5f6368"/>
  <text x="96" y="190" font-weight="600" fill="#202124">Entry  ga4_sample</text>
  <text x="96" y="208" fill="#5f6368">entry type: BigQuery Dataset</text>
  <rect x="96" y="222" width="298" height="26" rx="4" fill="#fef7e0" stroke="#fdd663"/>
  <text x="106" y="240" fill="#202124">Aspect: BigQuery Dataset (required)</text>
  <text x="96" y="272" fill="#5f6368">Description: copied from BigQuery</text>
  <text x="96" y="292" fill="#5f6368">Overview: none · Glossary terms: none</text>
  <text x="96" y="312" fill="#5f6368">Labels: none · Contacts: none</text>
  <text x="96" y="350" fill="#202124" font-weight="600">Entry list (children):</text>
  <text x="96" y="370" fill="#202124">• events  (bigquery-table)</text>

  <!-- Table entry -->
  <rect x="440" y="166" width="340" height="330" rx="8" fill="#ffffff" stroke="#5f6368"/>
  <text x="456" y="190" font-weight="600" fill="#202124">Entry  events</text>
  <text x="456" y="208" fill="#5f6368">entry type: BigQuery Table · parent: ga4_sample</text>
  <rect x="456" y="222" width="308" height="26" rx="4" fill="#fef7e0" stroke="#fdd663"/>
  <text x="466" y="240" fill="#202124">Aspect: BigQuery Table (required)</text>
  <rect x="456" y="254" width="308" height="26" rx="4" fill="#fef7e0" stroke="#fdd663"/>
  <text x="466" y="272" fill="#202124">Aspect: Storage (required)</text>
  <rect x="456" y="286" width="308" height="26" rx="4" fill="#fef7e0" stroke="#fdd663"/>
  <text x="466" y="304" fill="#202124">Aspect: Schema (shown on Schema tab)</text>
  <rect x="456" y="318" width="308" height="26" rx="4" fill="#fce8e6" stroke="#f28b82"/>
  <text x="466" y="336" fill="#202124">Aspect: BigQuery Policy (optional)</text>
  <rect x="456" y="350" width="308" height="26" rx="4" fill="#ffffff" stroke="#9aa0a6" stroke-dasharray="4 3"/>
  <text x="466" y="368" fill="#5f6368">Aspect: Overview (empty, "+ Add")</text>
  <text x="456" y="404" fill="#5f6368">Description: none · Labels: none</text>
  <text x="456" y="424" fill="#5f6368">Glossary terms: none (attached via entry links)</text>
  <text x="456" y="460" fill="#202124" font-weight="600">Studio later adds:</text>
  <text x="456" y="480" fill="#202124">overlay entries in a context set, linked here</text>

  <line x1="410" y1="366" x2="440" y2="190" stroke="#5f6368" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6368"/></marker></defs>
</svg>
